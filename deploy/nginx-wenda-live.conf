# nginx server block for Wenda-Live.
#
# Terminates TLS and reverse-proxies to the Daphne ASGI server (see
# wenda-live.service). Handles three things nginx is better at than Daphne:
#   1. HTTPS + the HTTP->HTTPS redirect,
#   2. serving collected static files directly from disk,
#   3. upgrading /ws/ connections to WebSocket.
#
# Install:
#   sudo cp deploy/nginx-wenda-live.conf /etc/nginx/sites-available/wenda-live
#   sudo ln -s /etc/nginx/sites-available/wenda-live /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Get the certs first (certbot fills in the ssl_* lines for you):
#   sudo certbot --nginx -d live.example.com
#
# Adjust: server_name, the ssl_certificate paths, and the two filesystem paths
# (STATIC_ROOT and, if you ever add user uploads, MEDIA_ROOT).

upstream wenda_live_asgi {
    server 127.0.0.1:8001;
}

# --- HTTP: redirect everything to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name live.example.com;

    # Let certbot answer ACME challenges over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: the real app ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name live.example.com;

    # Managed by certbot (these paths are the certbot defaults).
    ssl_certificate     /etc/letsencrypt/live/live.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.example.com/privkey.pem;

    # WebSocket upgrades can be long-lived (a full game); don't cut them at 60s.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Allow large-ish bodies just in case; the app itself posts only small forms.
    client_max_body_size 10M;

    # Collected static files (run `manage.py collectstatic`), served by nginx.
    # Must match settings.STATIC_URL (/static/) and STATIC_ROOT (staticfiles/).
    location /static/ {
        alias /srv/wenda-live/staticfiles/;
        access_log off;
        expires 30d;
    }

    # WebSocket endpoints (ws/host/<code>/, ws/play/<code>/) need the Upgrade
    # dance; everything else is plain proxying below.
    location /ws/ {
        proxy_pass http://wenda_live_asgi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tells Django (via SECURE_PROXY_SSL_HEADER) the original request was HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All normal HTTP traffic.
    location / {
        proxy_pass http://wenda_live_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
